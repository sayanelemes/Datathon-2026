# 2MP / CashGuard: docker compose up -d
#   api    — FastAPI: POST /api/v1/analyze, GET /api/v1/jobs/{id}, веб-интерфейс (порт 8000)
#   worker — кадры, YOLOX, RTMPose, ByteTrack, правила, Qwen, Legal-RAG, видео с разметкой
#   vllm   — Qwen3-VL-8B (OpenAI-совместимый API, только внутри сети compose)
#   redis  — очередь задач и статусы
# Нужны: NVIDIA Container Toolkit, файл .env (cp .env.example .env, задайте API_KEY).

x-app: &app
  build: .
  image: cashguard:latest
  restart: unless-stopped
  env_file:
    - profiles/compose.env
    - path: .env
      required: false          # .env необязателен: без него API_KEY берётся из окружения
  environment:
    REDIS_URL: redis://redis:6379/0
    VLLM_URL: http://vllm:8000/v1
    VLM_MODEL: qwen
    PROFILE: compose
  volumes:
    - data:/data
    - models:/models
    - rtmlib_cache:/root/.cache/rtmlib
    - ./configs:/app/configs:ro
    - ./legal_base:/app/legal_base:ro

services:
  redis:
    image: redis:7.2.5-alpine       # 7.2 — последняя версия под BSD-3 (с 7.4 лицензия RSAL/SSPL)
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  vllm:
    image: vllm/vllm-openai:v0.11.0
    restart: unless-stopped
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    command:
      - --model
      - ${QWEN_MODEL:-Qwen/Qwen3-VL-8B-Instruct-FP8}
      - --served-model-name
      - qwen
      - --gpu-memory-utilization
      - "0.60"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "2"
      - --limit-mm-per-prompt
      - '{"image": 8}'
      - --enable-prefix-caching
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s        # первый запуск: скачивание весов (~10 ГБ) и компиляция графов

  api:
    <<: *app
    command: ["python3", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "75"]
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    <<: *app
    command: ["sh", "-c", "python3 tools/fetch_models.py --models $${FETCH_MODELS:-yolox_s} || true; exec python3 worker.py"]
    depends_on:
      redis:
        condition: service_healthy
      vllm:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  data:
  models:
  rtmlib_cache:
  hf_cache:
  redis:
