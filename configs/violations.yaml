# Каталог типов нарушений и норм.
# VLM выбирает только id. Документ, пункт и формулировку подставляет код — ссылки не выдумываются.
# Дополнить типами из датасета (с нормой!).

# Сверено 17.10.2026 с текстом на zakon.uchet.kz (зеркало adilet.zan.kz), редакция с изменениями на 12.07.2026.
document: &doc "Правила осуществления кассовых операций и операций по инкассации банкнот, монет и ценностей в банках второго уровня..., утв. постановлением Правления НБРК № 231 от 29.11.2019 (рег. № 19680)"
document2: &doc2 "Правила № 231 (постановление Правления НБРК от 29.11.2019, рег. № 19680) и Правила организации охраны и устройства помещений банков второго уровня..., утв. постановлением Правления НБРК № 14 от 24.02.2020 (рег. № 20075)"

rules:
  - id: CASH_CONCEALMENT
    name: "Сокрытие части принятых наличных"
    visual: "кассир отделяет купюру(ы) и убирает их ниже стола, в карман, в рукав, в личные вещи или иначе прячет вне обзора клиента"
    doc: *doc
    point: "п. 20, п. 14"
    norm: "наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента (п. 20); обязанности распределяются так, чтобы исключались хищения и иные противоправные действия (п. 14)"

  - id: NO_RECOUNT_IN_FRONT
    name: "Принятые деньги не пересчитаны при клиенте"
    visual: "кассир принимает деньги и сразу убирает их (в ящик, сейф, стопку) без пересчёта вручную или на счётчике на виду у клиента"
    doc: *doc
    point: "п. 20"
    norm: "наличные деньги принимаются и пересчитываются кассовым работником в присутствии клиента"

  - id: PAYOUT_NO_RECOUNT
    name: "Выдача денег без пересчёта при клиенте"
    visual: "кассир передаёт клиенту деньги без предварительного пересчёта на виду у клиента"
    doc: *doc
    point: "п. 31, пп. 4"
    norm: "кассир пересчитывает подготовленные к выдаче наличные деньги в присутствии клиента, выдаёт клиенту наличные деньги"

  - id: CASHIER_LEFT_DURING_SERVICE
    name: "Кассир покинул рабочее место во время обслуживания"
    visual: "клиент ВИДЕН в кадре у кассы, а кассир встаёт и уходит из рабочей зоны, не закончив его обслуживание (уход без клиента — не этот тип)"
    doc: *doc
    point: "п. 22"
    norm: "кассовому работнику не допускается покидать рабочее место до окончания обслуживания клиента"

  - id: KEY_LEFT_UNATTENDED
    name: "Ключ от хранилища оставлен без присмотра"
    visual: "кассир уходит с рабочего места и НЕ забирает ключ от шкафчика / сейфа / ящика стола: ключ остаётся в замке или на столе, либо шкафчик остаётся открытым. В норме кассир запирает шкафчик и уносит ключ с собой (в руке, в кармане)"
    doc: *doc
    point: "п. 80 (см. также п. 20)"
    norm: "порядок хранения ключей от специальных устройств на рабочем месте кассового работника (металлический шкаф, сейф, тележка, ящики стола) должен исключать их несанкционированное использование (п. 80); ранее принятые наличные деньги хранятся в запираемых устройствах на рабочем месте кассира (п. 20)"

  - id: CASH_LEFT_UNATTENDED
    name: "Наличные оставлены без присмотра"
    visual: "кассир уходит с рабочего места, а деньги остаются на столе или в открытом ящике / сейфе — не убраны в запираемое хранилище"
    doc: *doc
    point: "п. 20"
    norm: "ранее принятые наличные деньги хранятся в запираемых устройствах на рабочем месте кассира"

  - id: PHONE_AT_CASH_DESK
    name: "Мобильный телефон на рабочем месте кассира"
    visual: "кассир держит смартфон, пользуется им или смартфон лежит на рабочем столе кассира"
    doc: *doc
    point: "п. 12"
    norm: "хранение личных вещей работников осуществляется вне кассового узла; в кассовый узел допускается вносить только средства связи без функций фото- и видеосъёмки"

  - id: BAG_ACCEPTED_NO_CHECK
    name: "Сумка инкассатора принята без проверки"
    visual: "кассир принимает сумку/мешок от инкассатора и сразу убирает её, не осматривая целостность и пломбу"
    doc: *doc
    point: "п. 24"
    norm: "при приёме наличных от инкассации кассир проверяет целостность сумки и правильность пломбирования"

  - id: BAG_OPENED_NO_COLLECTOR
    name: "Вскрытие сумки без инкассатора"
    visual: "кассир вскрывает инкассаторскую сумку, когда работник инкассации отсутствует"
    doc: *doc
    point: "п. 25"
    norm: "при обнаружении нарушения целостности сумка вскрывается и пересчитывается в присутствии работника инкассации"

  - id: UNAUTHORIZED_PERSON
    name: "Посторонний в зоне хранения ценностей"
    visual: "посторонний человек (клиент и т.п.) заходит за стол кассира, к сейфу или в зону хранения денег"
    doc: *doc2
    point: "п. 75 Правил № 231; п. 8, пп. 1 п. 16 Правил № 14"
    norm: "вход в кладовую и (или) сейфовую комнату разрешается лицам, ответственным за сохранность, или в их сопровождении (п. 75 Правил № 231); кассовый узел изолирован, каждая касса имеет отдельный вход с закрывающейся на замок дверью (Правила № 14)"

  - id: OTHER
    name: "Иное подозрительное действие с наличными"
    visual: "явно подозрительное действие с деньгами или ценностями, не подходящее под типы выше"
    doc: *doc
    point: "п. 14"
    norm: "обязанности распределяются так, чтобы исключались конфликт интересов, хищения и иные противоправные действия"
