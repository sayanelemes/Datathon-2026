# Камера над кассой. Путь к файлу задаётся переменной CAMERA_CONFIG (по умолчанию этот файл).
#
# Зоны — многоугольники в НОРМИРОВАННЫХ координатах кадра: x и y от 0 до 1 (0,0 — левый верхний угол).
# Нормированные координаты не зависят от разрешения видео.
#
# zones_mode:
#   auto  — зоны находит Qwen на каждом видео (по умолчанию: финальное видео снято под другим углом);
#           зоны, явно заданные ниже, ВАЖНЕЕ автоматических (можно задать только restricted_zone, например).
#   yaml  — только зоны из этого файла, Qwen зоны не ищет (камера закреплена, разметили один раз).
#   off   — зон нет: правила, которым нужны зоны, отключаются, роли — по старой эвристике.
camera_id: camera_1
zones_mode: auto

# Как строить зоны из рамок, которые вернул Qwen (auto):
auto:
  transfer_margin: 0.10      # расширение стойки (зоны передачи) в долях её размера
  restricted_from: cashier   # restricted_zone = рабочее место кассира (за стойкой)

# Пример ручной разметки (раскомментируйте и подставьте свои точки):
zones: {}
#  cashier_zone:    [[0.30, 0.00], [0.80, 0.00], [0.80, 0.45], [0.30, 0.45]]
#  transfer_zone:   [[0.25, 0.40], [0.85, 0.40], [0.85, 0.58], [0.25, 0.58]]
#  client_zone:     [[0.20, 0.55], [0.90, 0.55], [0.90, 1.00], [0.20, 1.00]]
#  restricted_zone: [[0.30, 0.00], [0.80, 0.00], [0.80, 0.40], [0.30, 0.40]]
